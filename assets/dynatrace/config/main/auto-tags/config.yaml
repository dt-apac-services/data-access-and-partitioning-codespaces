configs:
  # NOTE: builtin:tags.auto-tagging is not available on 3rd-gen Dynatrace platform
  # These configs are skipped. Use Grail/DQL-based tagging instead.
  - id: easytrade_tag
    config:
      template: easytrade_tag.json
      skip: true  # Classic schema not available on 3rd-gen
    type:
      settings:
        schema: builtin:tags.auto-tagging
        scope: environment
  - id: component_tag
    config:
      template: component_tag.json
      skip: true  # Classic schema not available on 3rd-gen
    type:
      settings:
        schema: builtin:tags.auto-tagging
        scope: environment
  - id: environment_tag
    config:
      template: environment_tag.json
      skip: true  # Classic schema not available on 3rd-gen
    type:
      settings:
        schema: builtin:tags.auto-tagging
        scope: environment
  - id: platform_tag
    config:
      template: platform_tag.json
      skip: true  # Classic schema not available on 3rd-gen
    type:
      settings:
        schema: builtin:tags.auto-tagging
        scope: environment

